name: medtrace
description: "A tuberculosis monitoring ecosystem mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Navigation
  riverpod: ^2.4.1
  flutter_riverpod: ^2.4.1
  go_router: ^13.0.0
  
  # Supabase
  supabase_flutter: 2.12.4
  
  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.1
  
  # Local Storage
  shared_preferences: 2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Location & Maps
  geolocator: ^10.1.0
  google_maps_flutter: 2.17.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geocoding: ^2.1.1
  
  # Notifications
  flutter_local_notifications: 21.0.0
  timezone: 0.11.0
  
  # UI/UX
  flutter_screenutil: ^5.9.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  lottie: ^2.6.0
  
  # Image & Media
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  
  # PDF & Files
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # Security
  flutter_secure_storage: 10.3.0
  
  # Logging
  logger: ^2.0.0
  
  # Utilities
  equatable: ^2.0.5
  get_it: ^7.6.0
  connectivity_plus: 7.1.1
  device_info_plus: 13.1.0
  package_info_plus: 10.1.0
  cupertino_icons: ^1.0.8
  sign_in_with_apple: 8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    # - assets/animations/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F766E"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
  fullscreen: true

